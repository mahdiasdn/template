<!DOCTYPE html>

<html dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ویجت آسمان ۲×۲ - Aseman Android Widget</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Persian Fonts & Custom Palette -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aseman: {
              blue: '#3389FF',
              sky: '#2575FC',
              deep: '#1A68E5',
              sun: '#FF9E00',
              sunAccent: '#FF753E'
            }
          },
          fontFamily: {
            vazir: ['Vazirmatn', 'Peyda', 'Tahoma', 'sans-serif'],
          },
          boxShadow: {
            'widget': '0 16px 36px -8px rgba(37, 117, 252, 0.38), 0 6px 16px -4px rgba(26, 104, 229, 0.25)',
            'glass': 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.45)',
          }
        }
      }
    }
  </script>
<!-- Google Fonts: Vazirmatn -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<!-- Custom Styles: Glassmorphism & Spec Details -->
<style data-purpose="widget-3d-effects">
    /* Subtle 3D Depth on the Sky Blue Widget */
    .widget-sky-surface {
      background: linear-gradient(145deg, #3A92FF 0%, #297BF7 50%, #1E6BEE 100%);
      position: relative;
      overflow: hidden;
    }

    /* Inner Glass Sheen & Refraction Edge */
    .widget-sky-surface::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.15) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Subtle atmospheric cloud lighting curve in background */
    .widget-atmosphere-glow {
      position: absolute;
      top: -35%;
      right: -25%;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(255, 220, 150, 0.25) 0%, rgba(51, 137, 255, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Grid pattern for launcher showcase */
    .launcher-grid-bg {
      background-color: #F4F7FB;
      background-image: radial-gradient(#D6E2F0 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
  </style>
</head>
<body class="bg-[#EEF3F9] font-vazir text-slate-800 antialiased min-h-screen flex flex-col justify-between items-center p-4 sm:p-8 select-none">
<!-- BEGIN: ShowcaseHeader -->
<header class="w-full max-w-sm mb-4 text-center" data-purpose="showcase-header">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/80 border border-slate-200/80 shadow-sm text-xs font-semibold text-blue-600 mb-2">
<span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></span>
<span>سیستم ویجت‌های اندروید «آسمان»</span>
</div>
<h1 class="text-xl font-black text-slate-900 tracking-tight">ویجت سریع ۲×۲ (روز)</h1>
<p class="text-xs text-slate-500 mt-1 font-normal">اندازه استاندارد ۱۱۰×۱۱۰ دی‌پی • مینیمال با نگاه سریع</p>
</header>
<!-- END: ShowcaseHeader -->
<!-- BEGIN: MainMockupContainer -->
<main class="w-full max-w-sm flex flex-col items-center justify-center relative my-auto" data-purpose="mockup-stage">
<!-- Android Home Screen Mockup Canvas -->
<div class="launcher-grid-bg w-full aspect-[4/5] max-h-[520px] rounded-[44px] p-6 border border-white/80 shadow-2xl shadow-blue-900/10 flex flex-col justify-between items-center relative overflow-hidden backdrop-blur-md">
<!-- Android Top Status Bar Simulation -->
<div class="w-full flex justify-between items-center px-3 pt-1 text-[11px] font-bold text-slate-500" data-purpose="android-status-bar">
<span>۱۲:۴۵</span>
<div class="flex items-center gap-1.5 opacity-80" dir="ltr">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path></svg>
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path></svg>
<div class="w-4 h-2.5 border border-slate-600 rounded-sm p-0.5 flex items-center">
<div class="h-full bg-slate-600 w-3/4 rounded-2xs"></div>
</div>
</div>
</div>
<!-- Center Launcher Space Housing the 2x2 Widget Card -->
<div class="flex flex-col items-center justify-center w-full my-auto">
<!-- BEGIN: AsemanWidgetCard (110x110dp optical target) -->
<!-- Standard Android 2x2 Widget: 154px (~110dp at 1.4x scale) with 26px Material squircle radius -->
<article aria-label="ویجت آب‌وهوای آسمان - تهران" class="widget-sky-surface w-[156px] h-[156px] rounded-[28px] p-3.5 flex flex-col justify-between shadow-widget cursor-pointer transition-transform duration-200 active:scale-95" data-purpose="aseman-weather-compact-widget" id="aseman-2x2-widget" role="region">
<!-- Background Atmospheric Glow -->
<div class="widget-atmosphere-glow"></div>
<!-- Top Row: Translucent Soft Glass Weather Icon & Header Action -->
<div class="flex items-start justify-between relative z-10" data-purpose="widget-top-bar">
<!-- 3D Glass Partly-Cloudy Sun Icon (Aseman Style Sheet ID: PCLD_03) -->
<div class="w-12 h-12 relative flex items-center justify-center filter drop-shadow-[0_6px_10px_rgba(0,35,110,0.22)]" data-purpose="weather-3d-glass-icon">
<svg class="w-full h-full overflow-visible" viewbox="0 0 72 72">
<defs>
<!-- 3D Specular Sun Gradient -->
<radialgradient cx="35%" cy="30%" id="sun3DGloss" r="65%">
<stop offset="0%" stop-color="#FFF275"></stop>
<stop offset="25%" stop-color="#FFA800"></stop>
<stop offset="85%" stop-color="#FF6B00"></stop>
<stop offset="100%" stop-color="#E54F00"></stop>
</radialgradient>
<!-- Cloud Glass Base Gradient -->
<lineargradient id="cloudGlassDay" x1="20%" x2="80%" y1="10%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
<stop offset="45%" stop-color="#F2F8FF" stop-opacity="0.82"></stop>
<stop offset="100%" stop-color="#D7E9FE" stop-opacity="0.75"></stop>
</lineargradient>
<!-- Top Specular Highlight Edge -->
<lineargradient id="cloudRimLight" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"></stop>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"></stop>
</lineargradient>
<!-- Drop shadow for sun behind cloud -->
<filter height="140%" id="sunShadow" width="140%" x="-20%" y="-20%">
<fegaussianblur in="SourceAlpha" stddeviation="2"></fegaussianblur>
<feoffset dx="1" dy="2" result="offsetblur"></feoffset>
<fecomponenttransfer>
<fefunca slope="0.3" type="linear"></fefunca>
</fecomponenttransfer>
<femerge>
<femergenode></femergenode>
<femergenode in="SourceGraphic"></femergenode>
</femerge>
</filter>
</defs>
<!-- Volumetric 3D Sun Sphere -->
<circle cx="43" cy="26" fill="url(#sun3DGloss)" filter="url(#sunShadow)" r="16"></circle>
<!-- Sun Specular Reflection Dot -->
<ellipse cx="38" cy="21" fill="#FFF7B2" opacity="0.75" rx="4.5" ry="2.8" transform="rotate(-25 38 21)"></ellipse>
<!-- Translucent Refractive Front Cloud (Aseman Volumetric Shape) -->
<!-- Cloud Backing Ambient Glow -->
<path d="M 23 52 C 16 52 11 47 11 41 C 11 35.8 14.8 31.5 19.8 30.3 C 21.8 23.5 28 18.5 35.5 18.5 C 44.5 18.5 51.8 25.2 52.8 34 C 57.5 34.8 61 38.8 61 43.5 C 61 48.8 56.5 53 51 53 Z" fill="#C8E0FF" filter="blur(1.5px)" opacity="0.45"></path>
<!-- Cloud Front Body -->
<path d="M 22 50 C 15.5 50 11 45.5 11 39.8 C 11 34.8 14.8 30.8 19.5 29.8 C 21.5 23.2 27.5 18.5 34.8 18.5 C 43.5 18.5 50.5 24.8 51.5 33.2 C 55.8 34 59 37.8 59 42.2 C 59 47.2 54.8 51 49.5 51 Z" fill="url(#cloudGlassDay)" stroke="url(#cloudRimLight)" stroke-width="1.2" style="backdrop-filter: blur(4px);"></path>
<!-- Volumetric Cloud Bottom Depth Shade -->
<path d="M 12 42 C 15 48 24 50.5 35 50 C 45 49.5 54 47 58 43 C 58 46.5 54.5 50.5 49 50.5 L 22 50.5 C 16.5 50.5 12.5 46.5 12 42 Z" fill="#89BAF7" opacity="0.35"></path>
</svg>
</div>
<!-- Launcher Quick Dots / Indicator -->
<div class="flex items-center gap-0.5 pt-1.5 pl-1 opacity-70">
<span class="w-1 h-1 rounded-full bg-white"></span>
<span class="w-1 h-1 rounded-full bg-white/70"></span>
<span class="w-1 h-1 rounded-full bg-white/40"></span>
</div>
</div>
<!-- Bottom Group: Bold Persian Numeric Temp & Clean City Label -->
<div class="flex flex-col items-start justify-end relative z-10 pt-1" data-purpose="widget-temperature-and-city">
<!-- Persian Temperature with Degree Glyphs -->
<div class="flex items-start text-white tracking-tight leading-none drop-shadow-sm select-none">
<span class="text-[44px] font-black font-vazir leading-[1.05]">۲۲</span>
<span class="text-2xl font-bold font-vazir mr-0.5 mt-0.5 opacity-90">°</span>
</div>
<!-- Persian City Label & Condition -->
<div class="w-full flex items-center justify-between text-white/90 font-medium text-xs mt-0.5">
<span class="tracking-tight text-[13px] font-semibold text-white">تهران</span>
<span class="text-[10.5px] text-white/75 font-normal">نیمه‌ابری</span>
</div>
</div>
</article>
<!-- END: AsemanWidgetCard -->
<!-- Widget Optical Dimension Pill Badge -->
<div class="mt-4 px-3 py-1 rounded-full bg-white/90 border border-slate-200/90 shadow-xs flex items-center gap-1.5 text-[11px] text-slate-600 font-medium font-vazir" data-purpose="dimension-tag">
<svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<rect height="18" rx="4" width="18" x="3" y="3"></rect>
<path d="M3 9h18M9 21V9"></path>
</svg>
<span>۲×۲ سلول شبکه • ۱۱۰×۱۱۰ dp</span>
</div>
</div>
<!-- Android Home Navigation Bar Pill -->
<div class="w-24 h-1 rounded-full bg-slate-400/60 mb-0.5" data-purpose="android-gesture-pill"></div>
</div>
</main>
<!-- END: MainMockupContainer -->
<!-- BEGIN: WidgetTechnicalSpecs -->
<footer class="w-full max-w-sm mt-3 bg-white rounded-2xl p-3 border border-slate-200/80 shadow-xs text-xs text-slate-600" data-purpose="specs-annotation">
<div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-2">
<span class="font-bold text-slate-800 text-[11px]">مشخصات فنی ویجت (Design System)</span>
<span class="text-[10px] px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-semibold font-mono">ID: WGT_2X2_DAY</span>
</div>
<div class="grid grid-cols-3 gap-2 text-center text-[10px]">
<div class="bg-slate-50 p-1.5 rounded-lg border border-slate-100">
<p class="text-slate-400 mb-0.5">رنگ پایه</p>
<p class="font-bold text-blue-600 font-mono">#3389FF</p>
</div>
<div class="bg-slate-50 p-1.5 rounded-lg border border-slate-100">
<p class="text-slate-400 mb-0.5">انحنای گوشه</p>
<p class="font-bold text-slate-700">۲۸px (Material)</p>
</div>
<div class="bg-slate-50 p-1.5 rounded-lg border border-slate-100">
<p class="text-slate-400 mb-0.5">تایپ‌فیس</p>
<p class="font-bold text-slate-700">وزیرمتن بولد</p>
</div>
</div>
</footer>
<!-- END: WidgetTechnicalSpecs -->
<!-- Simple Interaction Script for Tactile Feedback Preview -->
<script data-purpose="widget-click-feedback">
    document.addEventListener('DOMContentLoaded', () => {
      const widget = document.getElementById('aseman-2x2-widget');
      if (widget) {
        widget.addEventListener('click', () => {
          widget.style.transform = 'scale(0.96)';
          setTimeout(() => {
            widget.style.transform = '';
          }, 150);
        });
      }
    });
  </script>
</body></html>
