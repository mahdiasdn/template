  </head><body class="bg-surface-cream text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex-1 flex flex-col relative w-full bg-surface-cream"><div class="flex flex-col w-full px-screen-margin pb-space-2xl justify-between relative overflow-hidden" style="min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));">
<!-- Soft Atmospheric Glow Underlay -->
<div class="absolute -top-16 -right-16 w-80 h-80 bg-secondary-container/30 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 -left-20 w-72 h-72 bg-primary-fixed/40 rounded-full blur-3xl pointer-events-none"></div>
<!-- Top Utilities Bar (RTL) -->
<div class="w-full flex items-center justify-between pt-space-md z-10">
<div class="flex items-center gap-space-xs">
<span class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-surface-container text-primary">
<span class="material-symbols-outlined text-body-md" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
</span>
<span class="font-h3 text-h3 text-on-surface font-semibold tracking-tight">آسمان</span>
</div>
<!-- Skip / رد کردن -->
<button class="font-label-md text-label-md text-secondary hover:text-on-surface transition-colors py-space-xs px-space-sm rounded-full active:bg-surface-variant/40" type="button">
      رد کردن
    </button>
</div>
<!-- Hero Visual Stage (Soft 3D Frosted Glass Weather Composition) -->
<div class="relative w-full my-auto py-space-md flex items-center justify-center">
<!-- Ambient Radial Halo -->
<div class="absolute w-64 h-64 rounded-full bg-gradient-to-tr from-sun-glow/20 via-sky-tint-bg to-primary-container/20 blur-2xl transform scale-110"></div>
<!-- Central 3D Glass Artwork Container -->
<div class="relative w-72 h-72 flex items-center justify-center">
<!-- 3D Frosted Cloud & Sun Master Artwork (Inline SVG with volumetric glass layers) -->
<svg class="w-64 h-64 drop-shadow-2xl select-none" fill="none" viewbox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Sun Gradients -->
<radialgradient cx="45%" cy="40%" id="sunGlow" r="60%">
<stop offset="0%" stop-color="#FFF2A8"></stop>
<stop offset="45%" stop-color="#FFB800"></stop>
<stop offset="100%" stop-color="#FF7A00"></stop>
</radialgradient>
<filter height="140%" id="sunBlur" width="140%" x="-20%" y="-20%">
<fegaussianblur stddeviation="8"></fegaussianblur>
</filter>
<!-- Glass Cloud Gradients -->
<lineargradient id="cloudBody" x1="20%" x2="90%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
<stop offset="50%" stop-color="#F2F8FF" stop-opacity="0.82"></stop>
<stop offset="100%" stop-color="#D4E7FF" stop-opacity="0.75"></stop>
</lineargradient>
<lineargradient id="cloudHighlight" x1="10%" x2="80%" y1="0%" y2="90%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"></stop>
<stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.6"></stop>
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"></stop>
</lineargradient>
<lineargradient id="cloudUnderbelly" x1="50%" x2="50%" y1="20%" y2="100%">
<stop offset="0%" stop-color="#8BB9F7" stop-opacity="0"></stop>
<stop offset="100%" stop-color="#5599EB" stop-opacity="0.45"></stop>
</lineargradient>
<!-- Inner Ambient Glow Filter -->
<filter height="150%" id="cloudSoftShadow" width="150%" x="-20%" y="-20%">
<fedropshadow dx="0" dy="16" flood-color="#005ab7" flood-opacity="0.22" stddeviation="16"></fedropshadow>
</filter>
</defs>
<!-- Luminous Sun Sphere (Offset top-left optical center) -->
<circle cx="96" cy="94" fill="#FFB800" filter="url(#sunBlur)" opacity="0.35" r="54"></circle>
<circle cx="96" cy="94" fill="url(#sunGlow)" r="46"></circle>
<!-- Sun Specular Reflection -->
<ellipse cx="84" cy="80" fill="#FFFFFF" opacity="0.45" rx="20" ry="12" transform="rotate(-20 84 80)"></ellipse>
<!-- 3D Glassmorphic Cloud Cluster -->
<g filter="url(#cloudSoftShadow)">
<!-- Base Volumetric Form -->
<path d="M72 174C52.1 174 36 157.9 36 138C36 119.5 49.9 104.2 68 102.3C73.3 78.4 94.6 60 120 60C148.7 60 172.3 81.8 175.5 109.8C191.6 112.5 204 126.4 204 143.2C204 163 187.9 174 168 174H72Z" fill="url(#cloudBody)"></path>
<!-- Translucent Shading & Sky Reflections -->
<path d="M72 174C52.1 174 36 157.9 36 138C36 119.5 49.9 104.2 68 102.3C73.3 78.4 94.6 60 120 60C148.7 60 172.3 81.8 175.5 109.8C191.6 112.5 204 126.4 204 143.2C204 163 187.9 174 168 174H72Z" fill="url(#cloudUnderbelly)"></path>
<!-- Specular Light Catch (Frosted Rim) -->
<path d="M68.5 103.5C73.6 80.2 94.4 62 119.5 62C147.6 62 170.8 83.2 174.2 110.8C189.9 113.6 202 127 202 143.2C202 153.5 197.6 162.2 190.5 167.8C198 160.8 200 148.5 197.5 138C193.5 121 178 111 168 110C164 77 136 65 116 65C92 65 74 81 68.5 103.5Z" fill="url(#cloudHighlight)"></path>
<!-- Crisp Front Glass Bevel Light Arc -->
<path d="M40 142C40 124 53 109 69 107C70.5 107 72 107.5 73 108.5C70.5 111.5 69 115.5 69 120C69 135 80 147 95 147H166C176 147 185 152 190 159C184 169 173 174 164 174H72C54.3 174 40 159.7 40 142Z" fill="#FFFFFF" opacity="0.25"></path>
</g>
</svg>
<!-- Floating Glass Chip 1: UV Index (Top Right RTL) -->
<div class="absolute -top-3 right-0 bg-surface-card/85 backdrop-blur-md px-space-md py-space-xs rounded-full shadow-md flex items-center gap-space-xs text-on-surface transform transition-transform hover:scale-105 duration-300">
<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-sun-glow/20 text-tertiary">
<span class="material-symbols-outlined text-label-md" style="font-variation-settings: 'FILL' 1;">light_mode</span>
</span>
<div class="flex items-center gap-1 font-label-md text-label-md">
<span class="font-semibold text-on-surface">UV ۶</span>
<span class="text-secondary opacity-60">•</span>
<span class="text-secondary">مناسب</span>
</div>
</div>
<!-- Floating Glass Chip 2: Air Quality (Bottom Right RTL) -->
<div class="absolute -bottom-2 right-2 bg-surface-card/90 backdrop-blur-md px-space-md py-space-xs rounded-full shadow-md flex items-center gap-space-xs text-on-surface transform transition-transform hover:scale-105 duration-300">
<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-secondary-container/40 text-primary">
<span class="material-symbols-outlined text-label-md">air</span>
</span>
<div class="flex items-center gap-1 font-label-md text-label-md">
<span class="font-semibold text-on-surface">AQI ۴۲</span>
<span class="text-secondary opacity-60">•</span>
<span class="text-secondary">هوای پاک</span>
</div>
</div>
<!-- Floating Glass Chip 3: Humidity (Bottom Left RTL) -->
<div class="absolute bottom-6 left-0 bg-surface-card/85 backdrop-blur-md px-space-md py-space-xs rounded-full shadow-md flex items-center gap-space-xs text-on-surface transform transition-transform hover:scale-105 duration-300">
<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-sky-tint-bg text-primary">
<span class="material-symbols-outlined text-label-md" style="font-variation-settings: 'FILL' 1;">humidity_percentage</span>
</span>
<span class="font-label-md text-label-md font-semibold text-on-surface">رطوبت ۶۴٪</span>
</div>
</div>
</div>
<!-- Narrative Content Section (Persian RTL) -->
<div class="w-full flex flex-col items-center text-center space-y-space-sm z-10">
<h2 class="font-h2 text-h2 text-on-surface font-bold tracking-normal leading-snug">
      پیش‌بینی دقیق، همیشه در دسترس
    </h2>
<p class="font-body-md text-body-md text-secondary max-w-xs leading-relaxed">
      پیش‌بینی ساعتی، ۱۴ روزه، کیفیت هوا و شاخص تابش خورشید، همه در یک نگاه آرامش‌بخش
    </p>
</div>
<!-- Interactive Controls & Pagination Area -->
<div class="w-full flex flex-col items-center space-y-space-lg pt-space-xl z-10">
<!-- 3-Step Pagination Indicators -->
<div aria-label="مراحل آشنایی" class="flex items-center gap-2" role="tablist">
<!-- Active Pill: Slide 1 -->
<span aria-current="step" class="w-8 h-2 rounded-full bg-primary transition-all duration-300 shadow-sm"></span>
<!-- Inactive Dot: Slide 2 -->
<span class="w-2 h-2 rounded-full bg-surface-dim transition-all duration-300"></span>
<!-- Inactive Dot: Slide 3 -->
<span class="w-2 h-2 rounded-full bg-surface-dim transition-all duration-300"></span>
</div>
<!-- Primary Action Button -->
<button class="w-full py-space-md px-space-xl bg-primary text-on-primary font-body-lg text-body-lg font-semibold rounded-full shadow-md shadow-primary/25 hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-space-xs" type="button">
<span>بعدی</span>
<span class="material-symbols-outlined text-body-lg transform rotate-180">arrow_forward</span>
</button>
</div>
</div>
<script>
  // Subtle interactive parallax tilt on mouse/pointer movement
  (function() {
    const hero = document.querySelector('.drop-shadow-2xl');
    if (!hero) return;
    
    window.addEventListener('pointermove', (e) => {
      const { clientX, clientY } = e;
      const xOffset = (clientX / window.innerWidth - 0.5) * 8;
      const yOffset = (clientY / window.innerHeight - 0.5) * 8;
      hero.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
    }, { passive: true });
  })();
</script></main></body></html>
