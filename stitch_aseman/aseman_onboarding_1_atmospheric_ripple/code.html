<!DOCTYPE html>

<html dir="rtl" lang="fa"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

ondary-fixed-variant": "#25486f", "on-tertiary": "#ffffff", "on-error-container": "#93000a", "on-primary-fixed": "#001b3f", "shadow-tint": "rgba(51, 137, 255, 0.16)", "surface-container-low": "#f6f3ed", "inverse-on-surface": "#f3f0eb" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "16px", "screen-margin": "16px", "space-xs": "8px", "space-lg": "20px", "space-xl": "24px", "space-2xs": "4px", "card-gap": "16px", "space-sm": "12px", "space-2xl": "32px", "space-3xl": "48px" }, "fontFamily": { "stat-value": ["Peyda"], "body-lg": ["Peyda"], "temp-hero-mobile": ["Peyda"], "temp-hero": ["Peyda"], "label-sm": ["Peyda"], "body-md": ["Peyda"], "h1": ["Peyda"], "h2": ["Peyda"], "h3": ["Peyda"], "body-sm": ["Peyda"], "label-md": ["Peyda"] }, "fontSize": { "stat-value": ["22px", { "lineHeight": "1.1", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }], "temp-hero-mobile": ["56px", { "lineHeight": "1.0", "letterSpacing": "-0.02em", "fontWeight": "700" }], "temp-hero": ["64px", { "lineHeight": "1.0", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "1.2", "fontWeight": "500" }], "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }], "h1": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }], "h2": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }], "h3": ["20px", { "lineHeight": "1.35", "fontWeight": "600" }], "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }], "label-md": ["13px", { "lineHeight": "1.3", "fontWeight": "500" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface-cream text-on-surface font-body-md text-body-md antialiased min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex-1 flex flex-col relative w-full bg-surface-cream"><div class="flex flex-col w-full px-screen-margin pb-space-2xl overflow-hidden select-none">
<!-- Top Navigation Utility Bar -->
<header class="w-full flex items-center justify-between py-space-sm">
<div class="flex items-center gap-space-xs text-primary">
<span class="w-2.5 h-2.5 rounded-full bg-primary animate-pulse"></span>
<span class="font-label-md text-label-md tracking-wider text-secondary font-semibold">آسمان</span>
</div>
<!-- RTL 'Skip' Link situated top-left in visual reading flow -->
<button class="group flex items-center gap-1.5 py-1.5 px-3 rounded-full bg-surface-container hover:bg-surface-container-high transition-all duration-200" type="button">
<span class="font-label-md text-label-md text-secondary group-hover:text-on-surface">رد کردن</span>
<span class="material-symbols-outlined text-secondary text-base transition-transform group-hover:-translate-x-0.5">chevron_left</span>
</button>
</header>
<!-- Visual Centerpiece: Atmospheric Sky Podium & Frosted Glass 3D Weather Entity -->
<div class="relative w-full aspect-square max-w-[360px] mx-auto flex items-center justify-center my-space-md">
<!-- Concentric Sky Aura Rings mimicking app icon -->
<div class="absolute inset-0 rounded-full bg-sky-tint-bg/50 scale-100 animate-pulse" style="animation-duration: 6s;"></div>
<div class="absolute inset-6 rounded-full bg-primary-fixed/25 scale-95"></div>
<div class="absolute inset-12 rounded-full bg-surface-lowest/70 backdrop-blur-md shadow-lg shadow-shadow-tint"></div>
<!-- Radiant Ambient Sun Glow -->
<div class="absolute top-8 left-12 w-32 h-32 rounded-full bg-sun-glow/30 blur-2xl pointer-events-none"></div>
<!-- Visual 3D Weather Artpiece (Sun & Cloud) -->
<div class="relative z-10 w-52 h-52 flex items-center justify-center">
<!-- Luminous Sun Orb -->
<div class="absolute top-6 left-10 w-24 h-24 rounded-full bg-gradient-to-tr from-sun-glow via-[#FFA800] to-[#FFE27A] shadow-xl shadow-sun-glow/40 transition-transform duration-700 hover:scale-105">
<div class="w-full h-full rounded-full bg-gradient-to-t from-transparent via-white/20 to-white/60"></div>
</div>
<!-- Tactile Frosted Glass 3D Cloud Structure with highlights -->
<div class="relative z-20 mt-10 w-44 h-28">
<!-- Back Frosted Cloud Base -->
<div class="absolute bottom-0 inset-x-0 h-20 rounded-full bg-surface-container-lowest/85 backdrop-blur-xl shadow-xl shadow-shadow-tint border-t border-glass-border"></div>
<!-- Cloud Puff Left -->
<div class="absolute bottom-4 left-4 w-20 h-20 rounded-full bg-surface-container-lowest/90 backdrop-blur-xl border-t border-glass-border"></div>
<!-- Cloud Puff Center Top -->
<div class="absolute bottom-7 left-14 w-24 h-24 rounded-full bg-surface-container-lowest/95 backdrop-blur-2xl shadow-inner border-t border-glass-border">
<!-- Glass Specular Highlight Sheen -->
<div class="w-10 h-6 mx-auto mt-2 rounded-full bg-white/60 blur-xs"></div>
</div>
<!-- Cloud Puff Right -->
<div class="absolute bottom-3 right-3 w-16 h-16 rounded-full bg-surface-container-lowest/80 backdrop-blur-xl"></div>
</div>
</div>
<!-- Tactile Floating Pill Chips (Asymmetric Heights & Depths) -->
<!-- Top-Right Floating Pill: UV Index -->
<div class="absolute top-4 right-1 z-30 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-md shadow-md shadow-shadow-tint/60 border-t border-glass-border animate-bounce" style="animation-duration: 4s;">
<span class="w-2 h-2 rounded-full bg-sun-glow"></span>
<span class="font-label-md text-label-md text-on-surface font-medium">شاخص UV ۶</span>
</div>
<!-- Mid-Left Floating Pill: Air Quality -->
<div class="absolute top-1/2 -left-2 -translate-y-4 z-30 flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-md shadow-md shadow-shadow-tint/60 border-t border-glass-border transition-transform hover:-translate-y-6">
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">eco</span>
<span class="font-label-md text-label-md text-on-surface font-medium">کیفیت هوا ۴۲</span>
</div>
<!-- Bottom-Right Floating Pill: Humidity -->
<div class="absolute bottom-3 right-4 z-30 flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-md shadow-md shadow-shadow-tint/60 border-t border-glass-border">
<span class="material-symbols-outlined text-primary text-sm">water_drop</span>
<span class="font-label-md text-label-md text-on-surface font-medium">رطوبت ۶۴٪</span>
</div>
</div>
<!-- Smart Micro Context Badge -->
<div class="mx-auto my-space-xs inline-flex items-center gap-2 px-3 py-1 rounded-full bg-secondary-container/30 text-on-secondary-container">
<span class="material-symbols-outlined text-sm text-primary">verified</span>
<span class="font-label-sm text-label-sm font-semibold">پایش لحظه‌ای ایستگاه‌های هواشناسی کشور</span>
</div>
<!-- Editorial Information Typography Block -->
<section class="flex flex-col items-center text-center px-space-xs mt-space-sm mb-space-xl">
<h1 class="font-h1 text-h1 text-on-surface tracking-tight mb-space-sm">
      پیش‌بینی دقیق، همیشه در دسترس
    </h1>
<p class="font-body-lg text-body-lg text-secondary max-w-[320px] leading-relaxed">
      پیش‌بینی ساعتی، ۱۴ روزه، کیفیت هوا و شاخص UV، همه در یک نگاه
    </p>
</section>
<!-- Interactive Integrated Split Navigation Footer -->
<footer class="w-full mt-auto pt-space-md flex items-center justify-between">
<!-- Persian RTL Pagination Dots (Slide 1 Active) -->
<div aria-label="مراحل آشنایی" class="flex items-center gap-2" role="tablist">
<button aria-label="صفحه ۱ از ۳" class="w-8 h-2.5 rounded-full bg-primary transition-all duration-300 shadow-sm shadow-primary/40" type="button"></button>
<button aria-label="صفحه ۲ از ۳" class="w-2.5 h-2.5 rounded-full bg-secondary-fixed-dim hover:bg-secondary transition-colors duration-200" type="button"></button>
<button aria-label="صفحه ۳ از ۳" class="w-2.5 h-2.5 rounded-full bg-secondary-fixed-dim hover:bg-secondary transition-colors duration-200" type="button"></button>
</div>
<!-- Primary Action 'Next' Button with RTL Directional Flow -->
<button class="group relative flex items-center gap-2.5 py-3 px-6 rounded-full bg-primary text-on-primary shadow-lg shadow-primary/25 hover:shadow-xl hover:shadow-primary/35 active:scale-95 transition-all duration-200" id="nextSlideBtn" type="button">
<span class="font-h3 text-h3 font-medium">بعدی</span>
<span class="material-symbols-outlined text-xl transition-transform duration-200 group-hover:-translate-x-1">arrow_back</span>
</button>
</footer>
</div>
<script>
  // Tactile click feedback for the next slide button
  document.getElementById('nextSlideBtn')?.addEventListener('click', function() {
    this.classList.add('scale-95');
    setTimeout(() => {
      this.classList.remove('scale-95');
    }, 150);
  });
</script></main></body></html>
