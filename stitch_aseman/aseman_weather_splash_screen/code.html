<!DOCTYPE html>

<html dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>آسمان | آب‌وهوا رو ساده ببین</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Vazirmatn for Persian typography & Plus Jakarta Sans as fallback -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Vazirmatn:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#3389FF',
              secondary: '#2575FC',
              lightSky: '#69A9FF',
              ambient: '#4A97FF',
              neutral: '#FFFCF6'
            }
          }
        }
      }
    };
  </script>
<!-- Styling: Layout, Animations, and Visual Lighting Effects -->
<style data-purpose="ambient-lighting">
    /* Subtle breathing ambient glow in background */
    @keyframes ambientGlow {
      0%, 100% {
        transform: scale(1) translate3d(0, 0, 0);
        opacity: 0.65;
      }
      50% {
        transform: scale(1.1) translate3d(0, -6px, 0);
        opacity: 0.85;
      }
    }

    .ambient-glow {
      animation: ambientGlow 7s ease-in-out infinite;
    }
  </style>
<style data-purpose="loading-animation">
    /* Subtle shimmer / progress animation for launch bar */
    @keyframes smoothProgress {
      0% {
        transform: translateX(110%);
        width: 25%;
      }
      50% {
        width: 55%;
      }
      100% {
        transform: translateX(-110%);
        width: 30%;
      }
    }

    .loading-bar-thumb {
      animation: smoothProgress 2.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }

    /* Floating subtle float for the hero icon */
    @keyframes subtleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    .float-card {
      animation: subtleFloat 5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-900 font-sans antialiased m-0 p-0 flex items-center justify-center min-h-screen select-none overflow-hidden">
<!-- BEGIN: Mobile Device Frame Container -->
<!-- Target device container matching portrait mobile viewport (iOS ~390px) -->
<main class="relative w-full max-w-[414px] h-[100dvh] max-h-[896px] overflow-hidden flex flex-col justify-between items-center bg-gradient-to-b from-[#3389FF] via-[#2F82FD] to-[#1E67E5] shadow-2xl" data-purpose="splash-screen-container">
<!-- BEGIN: Ambient Background Lighting & Effects -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<!-- Upper soft sun glow -->
<div class="ambient-glow absolute top-[18%] left-1/2 -translate-x-1/2 w-[340px] h-[340px] rounded-full bg-gradient-to-tr from-[#69B0FF]/40 to-[#FFE4A0]/25 blur-[65px]"></div>
<!-- Center diffused sky glow -->
<div class="absolute top-[42%] left-1/2 -translate-x-1/2 w-[280px] h-[280px] rounded-full bg-white/20 blur-[50px] mix-blend-overlay"></div>
<!-- Lower soft ambient light -->
<div class="absolute -bottom-16 left-1/2 -translate-x-1/2 w-[360px] h-[220px] rounded-full bg-[#1855C4]/60 blur-[60px]"></div>
<!-- Subtle iOS Status bar spacing guide -->
<div class="h-11 w-full flex justify-between items-center px-8 opacity-0 pointer-events-none">
<!-- Kept completely clear for authentic clean splash experience -->
</div>
</div>
<!-- END: Ambient Background Lighting & Effects -->
<!-- Top Spacer for True Center Balance -->
<div aria-hidden="true" class="w-full h-12 flex-shrink-0 z-10"></div>
<!-- BEGIN: Brand Hero Content Stack -->
<!-- Perfectly centered vertical content grouping (App Logo + Brand Name + Persian Tagline) -->
<section class="relative z-10 flex flex-col items-center justify-center px-6 -mt-8 text-center" data-purpose="brand-identity-stack">
<!-- App Squircle Logo Box -->
<div class="float-card relative mb-7">
<!-- Soft backlight glow under icon -->
<div aria-hidden="true" class="absolute inset-0 rounded-[34px] bg-white/30 blur-[18px] transform scale-95"></div>
<!-- Logo Image Container with iOS standard squircle styling and soft volumetric depth -->
<div class="relative w-32 h-32 sm:w-36 sm:h-36 rounded-[34px] overflow-hidden p-[2px] bg-gradient-to-b from-white/40 via-white/15 to-white/5 backdrop-blur-md shadow-[0_22px_45px_-12px_rgba(10,40,95,0.38),0_4px_16px_rgba(0,0,0,0.08)]">
<img alt="لوگوی آب‌وهوای آسمان" class="w-full h-full object-cover rounded-[32px] transform active:scale-95 transition-transform duration-300" draggable="false" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApyaQ7OTDBdGrnkshaERn3psHYBlM7RNg8TlclA_7h2vPS8PFQJj2lOua1MjcKk4rsugwcveOvZdMg_eLVP6yJs-Q-nU_o_1DO4cpHDRzNy8qmx_-Ajl88fc6EYCN1y34E-RDdqpPTX-e4i-sREopol1X5VCaNsaUw6vYxU52QnY_VHgi8FdGBt8bUiLGqiZ8rzl87D-PzducObtVQp4SvF4edUwocbSr1jGOMKjjYWqigmCo1S5Caa5TX9GwDvwEc8w"/>
</div>
</div>
<!-- App Name in Persian -->
<h1 class="text-white text-[38px] sm:text-[42px] font-extrabold tracking-tight drop-shadow-[0_2px_10px_rgba(15,45,100,0.25)] leading-tight select-none">
        آسمان
      </h1>
<!-- Brand Tagline in Persian -->
<p class="text-white/85 text-[15px] sm:text-[16px] font-normal tracking-wide mt-2 drop-shadow-[0_1px_4px_rgba(0,0,0,0.15)] select-none">
        آب‌وهوا رو ساده ببین
      </p>
</section>
<!-- END: Brand Hero Content Stack -->
<!-- BEGIN: Bottom Indicator & Version Section -->
<!-- Minimal launch indicator capsule and version stamp -->
<footer class="relative z-10 w-full flex flex-col items-center pb-10 sm:pb-12 pt-4" data-purpose="splash-footer">
<!-- Minimalist Loading Capsule Track -->
<div aria-label="در حال بارگذاری اطلاعات آب‌وهوا" aria-valuemax="100" aria-valuemin="0" class="relative w-28 sm:w-32 h-[3.5px] rounded-full bg-white/20 backdrop-blur-sm overflow-hidden mb-5" role="progressbar">
<!-- Animated soft glowing runner -->
<div class="loading-bar-thumb absolute top-0 bottom-0 right-0 bg-gradient-to-l from-white via-white/90 to-white/40 rounded-full shadow-[0_0_8px_rgba(255,255,255,0.85)]"></div>
</div>
<!-- Persian App Version Label -->
<span class="text-white/45 text-[11px] font-medium tracking-wider select-none font-sans dir-ltr text-center">
        نسخه ۱.۰
      </span>
<!-- iOS Home Indicator Spacing Bar -->
<div aria-hidden="true" class="w-32 h-1 bg-white/20 rounded-full mt-5 opacity-40 sm:opacity-50"></div>
</footer>
<!-- END: Bottom Indicator & Version Section -->
</main>
<!-- END: Mobile Device Frame Container -->
</body></html>
